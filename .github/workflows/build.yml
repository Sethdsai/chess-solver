name: Build Chess Solver APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Download Stockfish Android binaries
      run: |
        mkdir -p app/src/main/assets/stockfish/arm64-v8a
        mkdir -p app/src/main/assets/stockfish/armeabi-v7a
        mkdir -p app/src/main/assets/stockfish/x86_64
        mkdir -p app/src/main/assets/stockfish/x86

        SF_TAG="sf_18"
        SF_BASE="https://github.com/official-stockfish/Stockfish/releases/download/${SF_TAG}"

        # === arm64-v8a (most Android phones) ===
        echo "Downloading Stockfish arm64-v8a..."
        curl -L --max-time 300 "${SF_BASE}/stockfish-android-armv8.tar" -o /tmp/sf_arm64.tar
        echo "Downloaded arm64 tar: $(stat -c%s /tmp/sf_arm64.tar 2>/dev/null || echo 'MISSING') bytes"
        mkdir -p /tmp/sf_arm64
        tar xf /tmp/sf_arm64.tar -C /tmp/sf_arm64
        echo "All files in tar:"
        find /tmp/sf_arm64 -type f -executable | head -10
        find /tmp/sf_arm64 -type f -name "*.exe" -o -name "stockfish*" -not -name "*.txt" -not -name "*.md" -not -name "*.cff" | head -10
        # The binary might be named stockfish-android-armv8 or just in a bin/ dir
        SF_BIN=$(find /tmp/sf_arm64 -type f -executable -not -name "*.txt" -not -name "*.md" -not -name "*.cff" -not -name "*.py" | head -1)
        if [ -z "$SF_BIN" ]; then
          # Try any file that's not a text/doc file
          SF_BIN=$(find /tmp/sf_arm64 -type f ! -name "*.txt" ! -name "*.md" ! -name "*.cff" ! -name "*.py" ! -name "AUTHORS" ! -name "Copying" ! -path "*/wiki/*" ! -path "*/.git/*" | head -1)
        fi
        if [ -n "$SF_BIN" ]; then
          cp "$SF_BIN" app/src/main/assets/stockfish/arm64-v8a/stockfish
          chmod +x app/src/main/assets/stockfish/arm64-v8a/stockfish
          echo "arm64-v8a: Copied from $SF_BIN"
        else
          echo "arm64-v8a: No stockfish binary found in tar"
        fi

        # === armeabi-v7a (older Android phones) ===
        echo "Downloading Stockfish armeabi-v7a..."
        curl -L --max-time 300 "${SF_BASE}/stockfish-android-armv7-neon.tar" -o /tmp/sf_armv7.tar
        echo "Downloaded armv7 tar: $(stat -c%s /tmp/sf_armv7.tar 2>/dev/null || echo 'MISSING') bytes"
        mkdir -p /tmp/sf_armv7
        tar xf /tmp/sf_armv7.tar -C /tmp/sf_armv7
        echo "All files in tar:"
        find /tmp/sf_armv7 -type f -executable | head -10
        find /tmp/sf_armv7 -type f -name "*.exe" -o -name "stockfish*" -not -name "*.txt" -not -name "*.md" -not -name "*.cff" | head -10
        SF_BIN=$(find /tmp/sf_armv7 -type f -executable -not -name "*.txt" -not -name "*.md" -not -name "*.cff" -not -name "*.py" | head -1)
        if [ -z "$SF_BIN" ]; then
          SF_BIN=$(find /tmp/sf_armv7 -type f ! -name "*.txt" ! -name "*.md" ! -name "*.cff" ! -name "*.py" ! -name "AUTHORS" ! -name "Copying" ! -path "*/wiki/*" ! -path "*/.git/*" | head -1)
        fi
        if [ -n "$SF_BIN" ]; then
          cp "$SF_BIN" app/src/main/assets/stockfish/armeabi-v7a/stockfish
          chmod +x app/src/main/assets/stockfish/armeabi-v7a/stockfish
          echo "armeabi-v7a: Copied from $SF_BIN"
        else
          echo "armeabi-v7a: No stockfish binary found in tar"
        fi

        # x86_64 and x86: no official Android builds exist, Kotlin fallback will be used

        # === VERIFY ===
        echo "=== Stockfish binary verification ==="
        SUCCESS=0
        for abi in arm64-v8a armeabi-v7a x86_64 x86; do
          FILE="app/src/main/assets/stockfish/$abi/stockfish"
          if [ -f "$FILE" ]; then
            SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo "0")
            TYPE=$(file "$FILE" 2>/dev/null || echo "unknown")
            echo "  $abi: $SIZE bytes | $TYPE"
            if echo "$TYPE" | grep -qi "ELF"; then
              echo "  $abi: REAL ELF BINARY"
              SUCCESS=$((SUCCESS+1))
            else
              echo "  $abi: NOT AN ELF - REMOVING"
              rm -f "$FILE"
            fi
          else
            echo "  $abi: MISSING (will use Kotlin fallback)"
          fi
        done

        echo "=== $SUCCESS real Stockfish binaries found ==="
        if [ $SUCCESS -eq 0 ]; then
          echo "WARNING: No Stockfish binaries! App will use Kotlin fallback engine."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: chess-solver-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: chess-solver-release
        path: app/build/outputs/apk/release/*.apk
