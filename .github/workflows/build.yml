name: Build Chess Solver APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Install Android NDK
      run: |
        echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" 2>/dev/null || true
        NDK_DIR=$(ls -d ${ANDROID_HOME}/ndk/* | head -1)
        echo "NDK_PATH=$NDK_DIR" >> $GITHUB_ENV
        echo "NDK at: $NDK_DIR"

    - name: Compile Stockfish for Android
      run: |
        # Clone Stockfish
        git clone --depth 1 --branch sf_17.1 https://github.com/official-stockfish/Stockfish.git /tmp/stockfish-src || \
        git clone --depth 1 --branch sf_16.1 https://github.com/official-stockfish/Stockfish.git /tmp/stockfish-src
        
        TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
        
        # Create output directories
        mkdir -p app/src/main/assets/stockfish/arm64-v8a
        mkdir -p app/src/main/assets/stockfish/armeabi-v7a
        mkdir -p app/src/main/assets/stockfish/x86_64
        mkdir -p app/src/main/assets/stockfish/x86

        # === Compile for arm64-v8a ===
        echo "=== Compiling for arm64-v8a ==="
        cd /tmp/stockfish-src/src
        make clean 2>/dev/null || true
        make -j$(nproc) build \
          ARCH=armv8 \
          COMP=clang \
          CXX="$TOOLCHAIN/bin/aarch64-linux-android34-clang++" \
          CC="$TOOLCHAIN/bin/aarch64-linux-android34-clang" \
          EXE=stockfish 2>&1 && \
        cp stockfish $GITHUB_WORKSPACE/app/src/main/assets/stockfish/arm64-v8a/stockfish && \
        chmod +x $GITHUB_WORKSPACE/app/src/main/assets/stockfish/arm64-v8a/stockfish && \
        echo "arm64-v8a: OK" || echo "arm64-v8a: FAILED"

        # === Compile for armeabi-v7a ===
        echo "=== Compiling for armeabi-v7a ==="
        cd /tmp/stockfish-src/src
        make clean 2>/dev/null || true
        make -j$(nproc) build \
          ARCH=armv7-neon \
          COMP=clang \
          CXX="$TOOLCHAIN/bin/armv7a-linux-androideabi34-clang++" \
          CC="$TOOLCHAIN/bin/armv7a-linux-androideabi34-clang" \
          EXE=stockfish 2>&1 && \
        cp stockfish $GITHUB_WORKSPACE/app/src/main/assets/stockfish/armeabi-v7a/stockfish && \
        chmod +x $GITHUB_WORKSPACE/app/src/main/assets/stockfish/armeabi-v7a/stockfish && \
        echo "armeabi-v7a: OK" || echo "armeabi-v7a: FAILED"

        # === Compile for x86_64 ===
        echo "=== Compiling for x86_64 ==="
        cd /tmp/stockfish-src/src
        make clean 2>/dev/null || true
        make -j$(nproc) build \
          ARCH=x86-64-sse41-popcnt \
          COMP=clang \
          CXX="$TOOLCHAIN/bin/x86_64-linux-android34-clang++" \
          CC="$TOOLCHAIN/bin/x86_64-linux-android34-clang" \
          EXE=stockfish 2>&1 && \
        cp stockfish $GITHUB_WORKSPACE/app/src/main/assets/stockfish/x86_64/stockfish && \
        chmod +x $GITHUB_WORKSPACE/app/src/main/assets/stockfish/x86_64/stockfish && \
        echo "x86_64: OK" || echo "x86_64: FAILED"

        # === Compile for x86 ===
        echo "=== Compiling for x86 ==="
        cd /tmp/stockfish-src/src
        make clean 2>/dev/null || true
        make -j$(nproc) build \
          ARCH=x86-32-sse41-popcnt \
          COMP=clang \
          CXX="$TOOLCHAIN/bin/i686-linux-android34-clang++" \
          CC="$TOOLCHAIN/bin/i686-linux-android34-clang" \
          EXE=stockfish 2>&1 && \
        cp stockfish $GITHUB_WORKSPACE/app/src/main/assets/stockfish/x86/stockfish && \
        chmod +x $GITHUB_WORKSPACE/app/src/main/assets/stockfish/x86/stockfish && \
        echo "x86: OK" || echo "x86: FAILED"

        # List results
        echo "=== Stockfish binary results ==="
        for abi in arm64-v8a armeabi-v7a x86_64 x86; do
          if [ -f "$GITHUB_WORKSPACE/app/src/main/assets/stockfish/$abi/stockfish" ]; then
            SIZE=$(stat -c%s "$GITHUB_WORKSPACE/app/src/main/assets/stockfish/$abi/stockfish" 2>/dev/null || echo "0")
            echo "  $abi: $SIZE bytes"
            file "$GITHUB_WORKSPACE/app/src/main/assets/stockfish/$abi/stockfish" 2>/dev/null || true
          else
            echo "  $abi: MISSING"
          fi
        done

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: chess-solver-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: chess-solver-release
        path: app/build/outputs/apk/release/*.apk
