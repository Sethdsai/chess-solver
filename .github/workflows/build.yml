name: Build Chess Solver APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Download Stockfish Android binaries
      run: |
        mkdir -p app/src/main/assets/stockfish/arm64-v8a
        mkdir -p app/src/main/assets/stockfish/armeabi-v7a
        mkdir -p app/src/main/assets/stockfish/x86_64
        mkdir -p app/src/main/assets/stockfish/x86

        SF_TAG="sf_18"
        SF_BASE="https://github.com/official-stockfish/Stockfish/releases/download/${SF_TAG}"

        # === arm64-v8a (most Android phones) ===
        echo "Downloading Stockfish arm64-v8a..."
        curl -sL "${SF_BASE}/stockfish-android-armv8.tar" -o /tmp/sf_arm64.tar
        mkdir -p /tmp/sf_arm64 && tar xf /tmp/sf_arm64.tar -C /tmp/sf_arm64 2>/dev/null
        find /tmp/sf_arm64 -name "stockfish" -type f | head -1 | xargs -I{} cp {} app/src/main/assets/stockfish/arm64-v8a/stockfish 2>/dev/null || true

        # === armeabi-v7a (older Android phones) ===
        echo "Downloading Stockfish armeabi-v7a..."
        curl -sL "${SF_BASE}/stockfish-android-armv7-neon.tar" -o /tmp/sf_armv7.tar
        mkdir -p /tmp/sf_armv7 && tar xf /tmp/sf_armv7.tar -C /tmp/sf_armv7 2>/dev/null
        find /tmp/sf_armv7 -name "stockfish" -type f | head -1 | xargs -I{} cp {} app/src/main/assets/stockfish/armeabi-v7a/stockfish 2>/dev/null || true

        # x86_64 and x86: no official Android builds exist, so we leave them empty
        # The Kotlin engine will be used as fallback on emulators

        # Make executable
        chmod +x app/src/main/assets/stockfish/*/stockfish 2>/dev/null || true

        # === VERIFY ===
        echo "=== Stockfish binary verification ==="
        SUCCESS=0
        for abi in arm64-v8a armeabi-v7a x86_64 x86; do
          FILE="app/src/main/assets/stockfish/$abi/stockfish"
          if [ -f "$FILE" ]; then
            SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo "0")
            TYPE=$(file "$FILE" 2>/dev/null || echo "unknown")
            # Check it's actually an ELF binary
            FIRST=$(xxd -l 4 "$FILE" 2>/dev/null | head -1)
            echo "  $abi: $SIZE bytes | $TYPE | $FIRST"
            if echo "$TYPE" | grep -qi "ELF"; then
              echo "  $abi: REAL ELF BINARY"
              SUCCESS=$((SUCCESS+1))
            else
              echo "  $abi: NOT AN ELF - REMOVING"
              rm -f "$FILE"
            fi
          else
            echo "  $abi: MISSING (will use Kotlin fallback)"
          fi
        done

        echo "=== $SUCCESS real Stockfish binaries found ==="
        if [ $SUCCESS -eq 0 ]; then
          echo "WARNING: No Stockfish binaries! App will use Kotlin fallback engine."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: chess-solver-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: chess-solver-release
        path: app/build/outputs/apk/release/*.apk
