name: Build Chess Solver APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Download Stockfish Android binaries
      run: |
        mkdir -p app/src/main/assets/stockfish/arm64-v8a
        mkdir -p app/src/main/assets/stockfish/armeabi-v7a
        mkdir -p app/src/main/assets/stockfish/x86_64
        mkdir -p app/src/main/assets/stockfish/x86

        # Try official Stockfish releases for Android
        SF_TAG="sf_17.1"
        SF_BASE="https://github.com/official-stockfish/Stockfish/releases/download/${SF_TAG}"

        # === arm64-v8a (most modern Android phones) ===
        echo "=== Downloading Stockfish arm64-v8a ==="
        for tar_name in stockfish-android-armv8.tar stockfish-ubuntu-x86-64-avx2.tar; do
          echo "Trying ${SF_BASE}/${tar_name}..."
          if curl -L --max-time 120 --fail "${SF_BASE}/${tar_name}" -o /tmp/sf_arm64.tar 2>/dev/null; then
            echo "Downloaded: $(stat -c%s /tmp/sf_arm64.tar 2>/dev/null || echo '0') bytes"
            mkdir -p /tmp/sf_arm64
            tar xf /tmp/sf_arm64.tar -C /tmp/sf_arm64 2>/dev/null || true
            SF_BIN=$(find /tmp/sf_arm64 -type f -executable -not -name "*.txt" -not -name "*.md" -not -name "*.cff" -not -name "*.py" -not -name "AUTHORS" -not -name "Copying" | head -1)
            if [ -n "$SF_BIN" ]; then
              cp "$SF_BIN" app/src/main/assets/stockfish/arm64-v8a/stockfish
              chmod +x app/src/main/assets/stockfish/arm64-v8a/stockfish
              echo "arm64-v8a: Copied from $SF_BIN ($(stat -c%s app/src/main/assets/stockfish/arm64-v8a/stockfish) bytes)"
              break
            fi
            rm -rf /tmp/sf_arm64 /tmp/sf_arm64.tar
          fi
        done

        # === armeabi-v7a (older Android phones) ===
        echo "=== Downloading Stockfish armeabi-v7a ==="
        for tar_name in stockfish-android-armv7-neon.tar; do
          echo "Trying ${SF_BASE}/${tar_name}..."
          if curl -L --max-time 120 --fail "${SF_BASE}/${tar_name}" -o /tmp/sf_armv7.tar 2>/dev/null; then
            echo "Downloaded: $(stat -c%s /tmp/sf_armv7.tar 2>/dev/null || echo '0') bytes"
            mkdir -p /tmp/sf_armv7
            tar xf /tmp/sf_armv7.tar -C /tmp/sf_armv7 2>/dev/null || true
            SF_BIN=$(find /tmp/sf_armv7 -type f -executable -not -name "*.txt" -not -name "*.md" -not -name "*.cff" -not -name "*.py" -not -name "AUTHORS" -not -name "Copying" | head -1)
            if [ -n "$SF_BIN" ]; then
              cp "$SF_BIN" app/src/main/assets/stockfish/armeabi-v7a/stockfish
              chmod +x app/src/main/assets/stockfish/armeabi-v7a/stockfish
              echo "armeabi-v7a: Copied from $SF_BIN ($(stat -c%s app/src/main/assets/stockfish/armeabi-v7a/stockfish) bytes)"
              break
            fi
            rm -rf /tmp/sf_armv7 /tmp/sf_armv7.tar
          fi
        done

        # === Try alternative source: stockfish-android prebuilt from peterosterlund2 ===
        if [ ! -f app/src/main/assets/stockfish/arm64-v8a/stockfish ] || [ ! -f app/src/main/assets/stockfish/armeabi-v7a/stockfish ]; then
          echo "=== Trying peterosterlund2 stockfish-android ==="
          for release_url in \
            "https://github.com/peterosterlund2/stockfish-android/releases/download/v1.0/stockfish-android.zip" \
            "https://github.com/peterosterlund2/stockfish/releases/download/v1.0/stockfish-android.zip"; do
            if curl -L --max-time 120 --fail "$release_url" -o /tmp/sf_android.zip 2>/dev/null; then
              echo "Downloaded alternative: $(stat -c%s /tmp/sf_android.zip 2>/dev/null || echo '0') bytes"
              mkdir -p /tmp/sf_alt
              unzip -o /tmp/sf_android.zip -d /tmp/sf_alt 2>/dev/null || true
              # Find arm64 binary
              if [ ! -f app/src/main/assets/stockfish/arm64-v8a/stockfish ]; then
                SF_BIN=$(find /tmp/sf_alt -type f \( -name "stockfish*arm64*" -o -name "stockfish*armv8*" \) -executable 2>/dev/null | head -1)
                if [ -n "$SF_BIN" ]; then
                  cp "$SF_BIN" app/src/main/assets/stockfish/arm64-v8a/stockfish
                  chmod +x app/src/main/assets/stockfish/arm64-v8a/stockfish
                  echo "Alt arm64-v8a: Copied from $SF_BIN"
                fi
              fi
              # Find armv7 binary
              if [ ! -f app/src/main/assets/stockfish/armeabi-v7a/stockfish ]; then
                SF_BIN=$(find /tmp/sf_alt -type f \( -name "stockfish*armv7*" -o -name "stockfish*armeabi*" \) -executable 2>/dev/null | head -1)
                if [ -n "$SF_BIN" ]; then
                  cp "$SF_BIN" app/src/main/assets/stockfish/armeabi-v7a/stockfish
                  chmod +x app/src/main/assets/stockfish/armeabi-v7a/stockfish
                  echo "Alt armeabi-v7a: Copied from $SF_BIN"
                fi
              fi
              rm -rf /tmp/sf_alt /tmp/sf_android.zip
              break
            fi
          done
        fi

        # === VERIFY ALL BINARIES ===
        echo "=== Stockfish binary verification ==="
        SUCCESS=0
        for abi in arm64-v8a armeabi-v7a x86_64 x86; do
          FILE="app/src/main/assets/stockfish/$abi/stockfish"
          if [ -f "$FILE" ]; then
            SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo "0")
            TYPE=$(file "$FILE" 2>/dev/null || echo "unknown")
            echo "  $abi: $SIZE bytes | $TYPE"
            if echo "$TYPE" | grep -qi "ELF"; then
              echo "  $abi: VALID ELF BINARY"
              SUCCESS=$((SUCCESS+1))
            else
              echo "  $abi: NOT AN ELF - REMOVING"
              rm -f "$FILE"
            fi
          else
            echo "  $abi: MISSING (will use Kotlin fallback)"
          fi
        done

        echo "=== $SUCCESS real Stockfish binaries found ==="
        if [ $SUCCESS -eq 0 ]; then
          echo "WARNING: No Stockfish binaries found! App will use Kotlin fallback engine."
          echo "The Kotlin engine works but Stockfish provides much stronger play."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Rename Debug APK with version
      run: |
        APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        if [ -n "$APK" ]; then
          mv "$APK" app/build/outputs/apk/debug/chess-solver-v3-debug.apk
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: chess-solver-v3-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: chess-solver-v3-release
        path: app/build/outputs/apk/release/*.apk
